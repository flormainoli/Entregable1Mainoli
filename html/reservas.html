    <!-- Reservas -->
<section class="reservas-section py-5">
    <div class="container">
        <div class="section-header text-center mb-5">
            <div class="icon-wrapper mx-auto mb-3">
            <i class="bi bi-calendar-check-fill" style="font-size: 2.5rem;"></i>
            </div>
            <h1 class="mb-3">Mis Reservas</h1>
                <p class="text-muted">Aquí podés ver y editar todas tus reservas</p>
            </div>
    <!-- Filtros -->
            <div class="row mb-4">
                <div class="col-md-6 mx-auto">
                    <div class="btn-group w-100" role="group">
                        <button type="button" class="btn btn-outline-success active" id="filtrosActuales">
                            Actuales <span class="badge bg-success ms-1" id="countActuales">0</span>
                        </button>
                        <button type="button" class="btn btn-outline-success" id="filtrosPasados">
                            Pasadas <span class="badge bg-success ms-1" id="countPasadas">0</span>
                        </button>
                    </div>
                </div>
            </div>
            <div id="contenedor-reservas" class="row"></div>
            <div id="sin-reservas" class="text-center mt-4 d-none"><p>No tenés reservas todavía</p></div>
                <!-- Modal para editar reserva -->
             <div class="modal fade" id="modalEditarReserva" tabindex="-1">
                <div class="modal-dialog">
                <div class="modal-content shadow-lg rounded-4">
                    <div class="modal-header border-0">
                        <h5 class="modal-title">Editar Reserva </h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <form id="formEditarReserva">
                            <input type="hidden" id="editIndex">
                            <div class="mb-3">
                             <label class="form-label">Nombre y Apellido</label>
                             <input id="editNombre" type="text" class="form-control">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Cantidad de personas</label>
                                <input id="editComensales" type="number" min="1" max="10" class="form-control">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Fecha</label>
                                <input id="editFecha" type="text" class="form-control">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Hora</label>
                                <input id="editHora" type="text" class="form-control">
                            </div>
                            <div class="d-flex justify-content-between mt-4">
                                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
                                <button type="submit" class="btn btn-dark">Guardar cambios</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
</div>
        </div>
    </section>
